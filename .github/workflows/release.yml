name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build ${{ matrix.platform }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            arch: arm64
            runner: macos-14
          - platform: macos
            arch: x64
            runner: macos-13
          - platform: linux
            arch: amd64
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux UI dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libudev-dev libxkbcommon-dev
      - name: Build
        run: cargo build --bin meowisp --release
        env:
          MEOWISP_VERSION: ${{ github.ref_name }}
      - name: Package
        run: |
          python3 scripts/package_portable.py \
            --platform "${{ matrix.platform }}" \
            --arch "${{ matrix.arch }}" \
            --version "${{ github.ref_name }}" \
            --binary target/release/meowisp \
            --out-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: meowisp-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/*
